# Exobrain Pipeline Configuration
#
# Defines which AI agent CLI handles each step of the knowledge base workflow.
# Each role maps to a step in _scripts/prompts/guide.md.
#
# Roles:
#   ingest    — Step 2: Process ingested source into drafts (new-source prompt)
#   review    — Step 3: Independently verify drafts and persist verdicts
#   promote   — Step 4: Promote verified drafts to concepts
#   topics    — Step 5: Generate learning paths from concepts
#   lab       — Manual-only: generate and publish a learn-by-building lab for
#               one or more concepts or a concrete integration request. Grading
#               stays manual via _scripts/prompts/lab-review.md.
#
# Step 1 (ingest scripts) and Step 6 (quiz) are run manually.
# Step 7 (weekly-refine) should be run via crontab separately.

kb_root: "."

agents:
  - name: claude-ingest
    role: ingest
    command: "codex exec --yolo --skip-git-repo-check --model gpt-5.6-sol resume --last"
    max_concurrent: 1
    env: {}

  - name: codex-review
    role: review
    command: "claude --dangerously-skip-permissions --continue --model claude-sonnet-5 -p"
    max_concurrent: 1
    env: {}

  - name: codex-promote
    role: promote
    command: "codex exec --yolo --skip-git-repo-check --model gpt-5.6-terra resume --last"
    max_concurrent: 1
    env: {}

  - name: claude-topics
    role: topics
    command: "codex exec --yolo --skip-git-repo-check --model gpt-5.6-terra resume --last"
    max_concurrent: 1
    env: {}

  - name: codex-lab
    role: lab
    command: "codex exec --yolo --skip-git-repo-check --model gpt-5.6-sol resume --last"
    max_concurrent: 1
    env: {}

# Prompts sent to each role's agent.
# {source_dir} is replaced with the actual source path.
# {kb_root} is replaced with the knowledge base root.
prompts:
  ingest: >
    Read _scripts/prompts/new-source.md then process the new source in
    {source_dir} in English.
  review: >
    Read _scripts/prompts/review-drafts.md and independently verify only drafts
    whose source is {source_dir}. Persist review_status and verification evidence
    in each matching draft. Write all output in English.
  promote: >
    Read _scripts/prompts/promote-concept.md and use its verified-pipeline mode.
    The source is {source_dir}. Promote only these exact reviewed drafts, one at
    a time, and never scan or promote any other draft:
    {verified_drafts}
    Write all output in English.
  topics: >
    Look at concepts recently promoted from {source_dir} and update or create
    learning paths in topics/ that include them. Reuse existing topic files
    where the new concepts fit. Only create new topic files if no existing
    path covers the domain. Update _index/topics.md. Write in English.
  lab: >
    Read _scripts/prompts/lab-design.md then design a learn-by-building,
    fading-scaffold lab for this target or request: {source_dir}. Generate the
    raw spec first, restructure it as spec.diataxis.md with the doc-restructure
    skill, build the human review site from that document with the
    web-artifacts-builder skill, then publish the sanitized site as a dedicated
    Cloudflare Pages preview with the wrangler skill. Do not fill the learner's
    predictions or stubbed core. Write all output in English.
